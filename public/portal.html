<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Vault — WinOnAny</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{--void:#050507;--panel:#0B0B0F;--panel-2:#101016;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--text:#F2F2F4;--muted:#85858F;--muted-2:#5C5C66;--accent:#6E56F8;--accent-lift:#8B78FF;--ease:cubic-bezier(.16,1,.3,1)}
html{-webkit-font-smoothing:antialiased}
body{background:var(--void);color:var(--text);font-family:'Archivo',Arial,sans-serif;min-height:100vh;padding:0}
.topbar{position:sticky;top:0;z-index:60;background:rgba(5,5,7,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;min-height:62px;gap:12px}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.04em;text-decoration:none;color:var(--text)}
.mark .dot{width:7px;height:7px;background:var(--accent);box-shadow:0 0 14px 2px rgba(110,86,248,.8)}
.logout{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);background:none;border:0;cursor:pointer;transition:color .25s}
.logout:hover{color:var(--text)}
.main{max-width:1100px;margin:0 auto;padding:clamp(40px,6vw,72px) 20px}
.greeting{margin-bottom:clamp(36px,5vw,56px)}
.greeting .kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px}
.greeting h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.05em;line-height:1.02}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(14px,2vw,22px)}
.file-card{background:var(--panel);border:1px solid var(--line);padding:clamp(22px,3vw,32px);display:flex;flex-direction:column;gap:20px;position:relative;transition:border-color .4s,background .4s}
.file-card::before{content:"";position:absolute;left:0;top:0;width:2px;height:0;background:var(--accent);transition:height .5s var(--ease)}
.file-card:hover{background:var(--panel-2);border-color:var(--line-2)}
.file-card:hover::before{height:100%}
.file-card.locked{opacity:.45;pointer-events:none}
.file-tier{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-lift)}
.file-card h2{font-size:clamp(18px,2.5vw,22px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.file-card p{color:var(--muted);font-size:14px;line-height:1.6;flex:1}
.dl-link{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;
  font-size:13.5px;font-weight:600;padding:13px 20px;text-decoration:none;border:0;cursor:pointer;
  font-family:'Archivo',Arial,sans-serif;transition:background .3s;-webkit-tap-highlight-color:transparent}
.dl-link:hover{background:var(--accent-lift)}
.dl-link:disabled{opacity:.5;cursor:not-allowed}
.lock-msg{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.err-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);padding:10px 18px;font-size:13px;color:#F87171;display:none;max-width:90vw;text-align:center;z-index:99}
.err-toast.show{display:block}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <a class="mark" href="/"><span class="dot" aria-hidden="true"></span>WinOnAny</a>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
</header>

<main class="main" id="main">
  <div class="greeting">
    <p class="kicker" id="tierBadge">Loading…</p>
    <h1>Your vault.</h1>
  </div>
  <div class="files" id="files"></div>
</main>

<div class="err-toast" id="errToast"></div>

<script>
(function() {
  var TOKEN_KEY = 'woa_token';

  var FILES = [
    { key: 'access',  label: 'Starter',     title: 'WinOnAny Starter',      desc: 'The entry point. Openers, profile setup, and the core frameworks that move conversations forward.' },
    { key: 'system',  label: 'The Vault',   title: 'WinOnAny — The Vault',  desc: 'Full platform playbooks, escalation strategies, conversation breakdowns, and situation-specific guides.' },
    { key: 'control', label: 'Full Access', title: 'WinOnAny — Full Access', desc: 'Everything in The Vault plus advanced methods, real thread breakdowns, and every future drop.' },
  ];

  var TIER_RANK = { access: 1, system: 2, control: 3 };

  // FIX: every request to /api/auth/me (and download) must send Authorization: Bearer <token>
  // The old code did a bare fetch() with no headers — requireAuth returned 401 every time,
  // the portal redirected to /login, creating the infinite loop.
  function authFetch(url, opts) {
    var token = localStorage.getItem(TOKEN_KEY);
    return fetch(url, Object.assign({}, opts || {}, {
      headers: Object.assign({}, (opts && opts.headers) || {}, {
        'Authorization': token ? 'Bearer ' + token : '',
        'Content-Type':  'application/json'
      })
    }));
  }

  var errToast = document.getElementById('errToast');
  function showErr(msg) {
    errToast.textContent = msg;
    errToast.classList.add('show');
    setTimeout(function() { errToast.classList.remove('show'); }, 4000);
  }

  // FIX: /api/download/account requires the Bearer header too.
  // Plain <a href> can't send custom headers — intercept click, fetch with auth, pipe to blob.
  function dlAccount(fileKey, btn) {
    btn.disabled    = true;
    btn.textContent = 'Downloading…';

    authFetch('/api/download/account?file=' + encodeURIComponent(fileKey))
    .then(function(r) {
      if (r.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        window.location.href = '/login?next=/portal';
        return null;
      }
      if (!r.ok) { throw new Error('Download failed (' + r.status + ')'); }
      return r.blob();
    })
    .then(function(blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob);
      var a   = document.createElement('a');
      a.href     = url;
      a.download = 'winonany-' + fileKey + '.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 10000);
      btn.disabled    = false;
      btn.textContent = 'Download PDF →';
    })
    .catch(function(err) {
      showErr(err.message || 'Download failed. Try again.');
      btn.disabled    = false;
      btn.textContent = 'Download PDF →';
    });
  }

  function render(userTier) {
    var badge     = document.getElementById('tierBadge');
    var container = document.getElementById('files');
    var labels    = { access: 'Starter', system: 'The Vault', control: 'Full Access' };

    badge.textContent = labels[userTier] || (userTier || 'No active plan');
    container.innerHTML = '';

    FILES.forEach(function(f) {
      var unlocked = userTier && TIER_RANK[f.key] <= TIER_RANK[userTier];
      var card     = document.createElement('div');
      card.className = 'file-card' + (unlocked ? '' : ' locked');

      var actionHtml;
      if (unlocked) {
        actionHtml = '<button class="dl-link" data-file="' + f.key + '">Download PDF →</button>';
      } else {
        actionHtml = '<p class="lock-msg">Upgrade to unlock</p>';
      }

      card.innerHTML =
        '<p class="file-tier">' + f.label + '</p>' +
        '<h2>' + f.title + '</h2>' +
        '<p>' + f.desc + '</p>' +
        actionHtml;

      if (unlocked) {
        var btn = card.querySelector('.dl-link');
        btn.addEventListener('click', function() {
          dlAccount(f.key, btn);
        });
      }

      container.appendChild(card);
    });
  }

  // Boot: guard before any fetch
  var token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    window.location.href = '/login?next=/portal';
    return;
  }

  authFetch('/api/auth/me')
  .then(function(r) {
    if (r.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = '/login?next=/portal';
      return null;
    }
    return r.json();
  })
  .then(function(d) {
    if (d && d.user) render(d.user.tier);
  })
  .catch(function() {
    window.location.href = '/login?next=/portal';
  });

  document.getElementById('logoutBtn').addEventListener('click', function() {
    var t = localStorage.getItem(TOKEN_KEY);
    localStorage.removeItem(TOKEN_KEY);
    fetch('/api/auth/logout', {
      method: 'POST',
      headers: { 'Authorization': t ? 'Bearer ' + t : '' }
    }).finally(function() {
      window.location.href = '/';
    });
  });
})();
</script>
</body>
</html>
