<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Expired — WinOnAny</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050507;color:#F2F2F4;font-family:'Archivo',Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased}
.card{max-width:460px;width:100%;background:#0B0B0F;border:1px solid rgba(255,255,255,.07);padding:40px 32px;position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#E05555}
.kicker{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#5C5C66;margin-bottom:18px}
h1{font-size:clamp(24px,5vw,32px);font-weight:800;letter-spacing:-.04em;margin-bottom:14px}
p{color:#85858F;font-size:15px;line-height:1.65;margin-bottom:24px}
a{display:inline-block;background:#6E56F8;color:#fff;font-size:14px;font-weight:600;padding:14px 26px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <p class="kicker">Link expired</p>
  <h1>This link is no longer active.</h1>
  <p>Download links are valid for 48 hours after purchase. Check your email for the original link, or contact support.</p>
  <a href="/">Back to WinOnAny</a>
</div>
</body>
</html>
