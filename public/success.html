<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're In — WinOnAny</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050507;--panel:#0B0B0F;--panel-2:#101016;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#F2F2F4;--muted:#85858F;--muted-2:#5C5C66;
  --accent:#6E56F8;--accent-lift:#8B78FF;
  --accent-soft:rgba(110,86,248,.14);--accent-line:rgba(110,86,248,.42);
  --gold:#C9A84C;--gold-soft:rgba(201,168,76,.14);--gold-line:rgba(201,168,76,.42);
  --green:#22c55e;--green-soft:rgba(34,197,94,.12);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --gutter:18px;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--display);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:#fff}

.bg-glow{position:fixed;left:50%;top:-30%;width:min(900px,130vw);aspect-ratio:1/.65;transform:translateX(-50%);pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,rgba(110,86,248,.18),rgba(110,86,248,.05) 44%,transparent 70%);filter:blur(10px)}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%);mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%)}

.topbar{position:sticky;top:0;z-index:60;background:rgba(5,5,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.04em}
.brand .dot{width:7px;height:7px;background:var(--accent);box-shadow:0 0 14px 2px rgba(110,86,248,.8);flex-shrink:0}

.page{position:relative;z-index:2;min-height:calc(100vh - 62px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(36px,6vw,72px) var(--gutter) 60px}
.wrap{width:100%;max-width:680px;animation:fadeUp .5s var(--ease) both}

.confirmed{display:inline-flex;align-items:center;gap:9px;background:var(--green-soft);border:1px solid rgba(34,197,94,.3);padding:7px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:28px}
.confirmed svg{width:13px;height:13px}

.hero-title{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.05em;line-height:1.08;margin:0 0 12px}
.hero-sub{color:var(--muted);font-size:16px;margin:0 0 40px;max-width:520px}

.dl-card{background:var(--panel);border:1px solid var(--line-2);position:relative;overflow:hidden;margin-bottom:14px}
.dl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.dl-card.tier-access::before{background:var(--accent)}
.dl-card.tier-system::before{background:var(--accent-lift)}
.dl-card.tier-control::before{background:var(--gold)}
.dl-card-inner{padding:22px 24px 22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dl-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin-bottom:5px}
.dl-name{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.dl-desc{font-size:13px;color:var(--muted);line-height:1.4}
.dl-btn{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 20px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;flex-shrink:0;transition:.3s var(--ease);border:0;cursor:pointer}
.dl-btn:hover{background:var(--accent-lift);box-shadow:0 12px 40px -12px rgba(110,86,248,.8)}
.dl-card.tier-control .dl-btn{background:var(--gold);color:#050507}
.dl-card.tier-control .dl-btn:hover{background:#d9b85c}
.dl-btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.dl-btn.loading .dl-btn-text,.dl-btn.loading svg{display:none}
.dl-btn.loading .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

.expiry-note{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--muted-2);margin:20px 0 36px;display:flex;align-items:center;gap:8px}
.expiry-note svg{width:12px;height:12px;flex-shrink:0}

.steps-head{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin-bottom:16px}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.step{display:flex;gap:14px;align-items:flex-start}
.step-num{width:26px;height:26px;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--accent-lift);flex-shrink:0;margin-top:2px}
.step-body{font-size:14px;color:#CFCFD6;line-height:1.5}
.step-body strong{color:var(--text);font-weight:600}

.divider{height:1px;background:var(--line);margin:36px 0}
.err-banner{display:none;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);padding:10px 14px;font-size:13px;color:#F87171;line-height:1.5;margin-bottom:16px}
.err-banner.show{display:block}

.footer{border-top:1px solid var(--line);padding:22px var(--gutter);position:relative;z-index:2;margin-top:auto}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.footer p,.footer a{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase}
.footer a{transition:color .25s}
.footer a:hover{color:var(--muted)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-mesh" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand"><i class="dot" aria-hidden="true"></i>WinOnAny</span>
  </div>
</header>

<div class="page">
  <div class="wrap" id="root"></div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <p>18+ only · One payment · No subscription</p>
    <nav style="display:flex;gap:18px">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
      <a href="/contact">Contact</a>
    </nav>
  </div>
</footer>

<script>
(function(){
  'use strict';

  var root = document.getElementById('root');
  var WOA  = window.__WOA__;

  var CHK   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var DL    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

  if (!WOA || !WOA.token || !WOA.tier) {
    root.innerHTML =
      '<div style="text-align:center;padding:80px 20px">' +
        '<h1 style="font-size:clamp(24px,5vw,36px);font-weight:800;letter-spacing:-.04em;margin-bottom:12px">Link not found</h1>' +
        '<p style="color:var(--muted);font-size:15px;max-width:420px;margin:0 auto 28px">This page has expired or the link is invalid. DM <strong>@cynski</strong> on Telegram with your order email and we will sort it out.</p>' +
      '</div>';
    return;
  }

  // ── Tier metadata — names match actual PDF filenames ──
  // starter_1.pdf = access tier = "Starter"
  // vault.pdf     = system tier = "The Vault"
  // full.pdf      = control tier = "Full Access"
  var TIER_META = {
    access: {
      label: 'Starter',
      files: [
        { tier: 'access', name: 'Starter', file: 'starter_1.pdf', desc: 'Profile signals, openers, chat frameworks.' },
      ],
    },
    system: {
      label: 'The Vault',
      files: [
        { tier: 'access', name: 'Starter',   file: 'starter_1.pdf', desc: 'Profile signals, openers, chat frameworks.' },
        { tier: 'system', name: 'The Vault',  file: 'vault.pdf',     desc: 'Platform playbooks, escalation strategies, conversation breakdowns.' },
      ],
    },
    control: {
      label: 'Full Access',
      files: [
        { tier: 'access',  name: 'Starter',     file: 'starter_1.pdf', desc: 'Profile signals, openers, chat frameworks.' },
        { tier: 'system',  name: 'The Vault',    file: 'vault.pdf',     desc: 'Platform playbooks, escalation strategies.' },
        { tier: 'control', name: 'Full Access',  file: 'full.pdf',      desc: 'Advanced methods, thread breakdowns, psychology layer.' },
      ],
    },
  };

  var meta = TIER_META[WOA.tier];
  if (!meta) {
    root.innerHTML = '<p style="color:var(--muted);text-align:center;padding:60px 20px">Unknown tier. DM @cynski on Telegram for help.</p>';
    return;
  }

  var cardHtml = meta.files.map(function(f) {
    return (
      '<div class="dl-card tier-' + f.tier + '">' +
        '<div class="dl-card-inner">' +
          '<div>' +
            '<p class="dl-label">' + f.name + '</p>' +
            '<p class="dl-name">' + f.name + '</p>' +
            '<p class="dl-desc">' + f.desc + '</p>' +
          '</div>' +
          '<button class="dl-btn" data-file="' + f.tier + '" aria-label="Download ' + f.name + '">' +
            '<i class="spin" aria-hidden="true"></i>' + DL +
            '<span class="dl-btn-text">Download PDF</span>' +
          '</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  root.innerHTML =
    '<span class="confirmed">' + CHK + 'Payment confirmed</span>' +
    '<h1 class="hero-title">You\'re in.<br>' + meta.label + '.</h1>' +
    '<p class="hero-sub">Your guide' + (meta.files.length > 1 ? 's are' : ' is') + ' ready. Download below — links expire in 48 hours.</p>' +
    '<div id="err-banner" class="err-banner" role="alert" aria-live="polite"></div>' +
    cardHtml +
    '<p class="expiry-note">' + CLOCK + '48-hour download window. Save the files to your device now.</p>' +
    '<div class="divider"></div>' +
    '<p class="steps-head">What to do now</p>' +
    '<div class="steps">' +
      '<div class="step"><div class="step-num">1</div><div class="step-body"><strong>Download your guide(s)</strong> above — save to your phone.</div></div>' +
      '<div class="step"><div class="step-num">2</div><div class="step-body"><strong>Fix your profile first.</strong> Read that section before sending a single message.</div></div>' +
      '<div class="step"><div class="step-num">3</div><div class="step-body"><strong>Pick one opener</strong> and run it tonight.</div></div>' +
    '</div>';

  var errBanner = document.getElementById('err-banner');

  document.querySelectorAll('.dl-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      if (btn.classList.contains('loading')) return;
      var file = btn.dataset.file;
      var url  = '/api/download?token=' + encodeURIComponent(WOA.token) + '&file=' + encodeURIComponent(file);

      btn.classList.add('loading');

      fetch(url)
        .then(function(r) {
          if (!r.ok) {
            if (r.status === 410 || r.status === 404) throw new Error('Download link expired. DM @cynski on Telegram.');
            if (r.status === 403) throw new Error('Your tier does not include this file.');
            throw new Error('Download failed (' + r.status + '). Try again.');
          }
          return r.blob();
        })
        .then(function(blob) {
          var objUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href     = objUrl;
          a.download = btn.dataset.file === 'access' ? 'starter_1.pdf' : btn.dataset.file === 'system' ? 'vault.pdf' : 'full.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(objUrl); }, 10000);
          btn.classList.remove('loading');
        })
        .catch(function(err) {
          btn.classList.remove('loading');
          errBanner.textContent = err.message || 'Download failed. DM @cynski on Telegram for help.';
          errBanner.classList.add('show');
        });
    });
  });
})();
</script>
</body>
</html>
