<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — WinOnAny</title>
<meta name="theme-color" content="#050507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Square SDK loaded dynamically after /api/config so the correct
     sandbox vs production URL is used — mismatching them causes
     "Checkout failed to initialize" on Square.payments() call. -->
<style>
:root{
  --void:#050507;--panel:#0B0B0F;--panel-2:#101016;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#F2F2F4;--muted:#85858F;--muted-2:#5C5C66;
  --accent:#6E56F8;--accent-lift:#8B78FF;
  --accent-soft:rgba(110,86,248,.14);--accent-line:rgba(110,86,248,.42);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:18px;--ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--display);font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent-lift);outline-offset:3px}

.rails{position:fixed;inset:0;z-index:0;pointer-events:none}
.rails-inner{height:100%;max-width:1200px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:repeat(2,1fr)}
.rails-inner span{border-left:1px solid rgba(255,255,255,.03)}
.rails-inner span:first-child{border-left:0}
@media(min-width:760px){.rails-inner{grid-template-columns:repeat(4,1fr)}}

.bg-glow{position:fixed;left:50%;top:-30%;width:min(900px,130vw);aspect-ratio:1/.65;transform:translateX(-50%);pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,rgba(110,86,248,.18),rgba(110,86,248,.05) 44%,transparent 70%);filter:blur(10px);}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%);mask-image:radial-gradient(ellipse 78% 54% at 50% 22%,#000 20%,transparent 74%);}

.topbar{position:sticky;top:0;z-index:60;background:rgba(5,5,7,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;min-height:62px;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.04em}
.brand .dot{width:7px;height:7px;background:var(--accent);box-shadow:0 0 14px 2px rgba(110,86,248,.8);flex-shrink:0}
.secure-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);display:flex;align-items:center;gap:7px}
.secure-tag svg{width:11px;height:11px;color:var(--accent-lift)}

.page{position:relative;z-index:2;min-height:calc(100vh - 62px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(36px,6vw,72px) var(--gutter) 60px}

/* ── two-column layout on wide screens ── */
.checkout-grid{width:100%;max-width:900px;display:grid;grid-template-columns:1fr;gap:clamp(16px,3vw,28px)}
@media(min-width:760px){.checkout-grid{grid-template-columns:1fr 1fr;align-items:start}}

/* ── shared card shell ── */
.card{background:var(--panel);border:1px solid var(--line-2);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent 0%,var(--accent) 40%,var(--accent-lift) 60%,transparent 100%)}
.card-inner{padding:clamp(24px,4vw,36px) clamp(20px,3.5vw,32px)}

/* ── tier summary (left card) ── */
.tier-badge{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-lift);margin-bottom:14px;display:block}
.tier-price{font-size:clamp(38px,8vw,56px);font-weight:800;letter-spacing:-.06em;line-height:1}
.tier-price .cents{font-size:clamp(20px,4vw,28px);font-weight:600;opacity:.7}
.tier-name{font-size:clamp(16px,2.4vw,19px);font-weight:700;letter-spacing:-.03em;margin-top:10px}
.tier-sum{color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:7px}
.div{height:1px;background:var(--line);margin:20px 0}
.features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.features li{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:#CFCFD6;line-height:1.4}
.features li .chk{width:15px;height:15px;flex-shrink:0;background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;margin-top:2px}
.features li .chk svg{width:8px;height:8px;color:var(--accent-lift)}
.trust{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.trust svg{width:11px;height:11px;flex-shrink:0;color:var(--accent-lift)}

/* ── payment form (right card) ── */
.form-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:8px}
.form-section{margin-bottom:20px}

/* Square card element container */
#card-container{
  background:var(--panel-2);
  border:1px solid var(--line-2);
  padding:14px 14px 6px;
  transition:border-color .3s;
  min-height:40px;
}
#card-container.sq-focused{border-color:var(--accent)}
#card-container.sq-error{border-color:#ef4444}

/* Square injects an iframe — give it room */
#card-container iframe{display:block;width:100%}

.btn-pay{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:58px;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:.01em;border:0;
  position:relative;overflow:hidden;
  transition:.4s var(--ease);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  margin-top:4px;
}
.btn-pay::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);transform:translateX(-110%);transition:transform .7s var(--ease)}
.btn-pay:not(:disabled):hover{background:var(--accent-lift);box-shadow:0 18px 52px -18px rgba(110,86,248,.9)}
.btn-pay:not(:disabled):hover::after{transform:translateX(110%)}
.btn-pay:not(:disabled):active{transform:scale(.98)}
.btn-pay:disabled{opacity:.55;cursor:not-allowed}
.btn-pay .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;flex-shrink:0;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-pay.loading .spin{display:block}
.btn-pay.loading .btn-label,.btn-pay.loading .arw{display:none}

.err{display:none;background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.28);padding:10px 13px;font-size:13px;color:#F87171;line-height:1.5;margin-top:14px}
.err.show{display:block}

.pay-note{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);text-align:center;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.native-pay-btn{
  display:none;width:100%;height:52px;margin-bottom:10px;
  align-items:center;justify-content:center;gap:10px;
  border:0;cursor:pointer;font-size:15px;font-weight:600;
  font-family:var(--display);letter-spacing:.01em;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#google-pay-button{background:#fff;color:#000;}
#google-pay-button svg{flex-shrink:0}
#apple-pay-button{background:#000;color:#fff;}
#apple-pay-button svg{flex-shrink:0}
.pay-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted-2);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.pay-divider::before,.pay-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.pay-note svg{width:10px;height:10px;flex-shrink:0}

.back-link{display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-top:clamp(16px,3vw,24px);transition:color .25s}
.back-link:hover{color:var(--muted)}

/* ── skeleton loader ── */
.sk{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 50%,var(--panel) 75%);background-size:400% 100%;animation:sk 1.4s ease infinite;height:14px;margin:8px 0}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ── not-found ── */
.not-found{text-align:center;padding:clamp(60px,10vw,100px) 20px}
.not-found h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.04em;margin-bottom:12px}
.not-found p{color:var(--muted);font-size:15px;margin-bottom:28px}
.not-found a{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border:1px solid var(--line-2);font-weight:600;font-size:14px;transition:.3s var(--ease)}
.not-found a:hover{border-color:rgba(255,255,255,.32)}

.footer{border-top:1px solid var(--line);padding:22px var(--gutter);position:relative;z-index:2}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.footer p,.footer a{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase}
.footer a{transition:color .25s}
.footer a:hover{color:var(--muted)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.checkout-grid{animation:fadeUp .55s var(--ease) both}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div class="rails" aria-hidden="true"><div class="rails-inner"><span></span><span></span><span></span><span></span></div></div>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-mesh" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand" aria-label="WinOnAny"><i class="dot" aria-hidden="true"></i>WinOnAny</span>
    <p class="secure-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure checkout
    </p>
  </div>
</header>

<div class="page">
  <div id="root" style="width:100%;max-width:900px"></div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <p>18+ only &nbsp;·&nbsp; One payment &nbsp;·&nbsp; No subscription</p>
    <p>18+ only &nbsp;·&nbsp; One payment &nbsp;·&nbsp; No subscription</p>
  </div>
</footer>

<script>
(function(){
  'use strict';

  var TIERS = {
    access: {
      badge:'Starter', name:'Starter Access',
      dollars:'29', cents:'99',
      summary:'The entry point. Scripts and openers that actually get responses.',
      features:['First message scripts','Profile optimization guide','Flirting frameworks'],
    },
    system: {
      badge:'Most Popular', name:'The Vault',
      dollars:'59', cents:'99',
      summary:'Full access. Every guide, every platform. Everything you need to start getting wins.',
      features:['Everything in Starter','Platform-specific playbooks (Snap, IG, Tinder, Hinge, X)','Escalation strategies','Conversation breakdowns','Reply psychology guide'],
    },
    control: {
      badge:'Full Access', name:'Full Access',
      dollars:'99', cents:'99',
      summary:'Everything in the vault plus every new drop. Covered for good.',
      features:['Everything in The Vault','Advanced platform methods','Real screenshot breakdowns','All future content included'],
    },
  };

  var params  = new URLSearchParams(window.location.search);
  var tier    = params.get('tier') || '';
  var data    = TIERS[tier];
  var root    = document.getElementById('root');

  /* ── no valid tier — send back to pricing ── */
  if(!data){
    window.location.replace('https://winonany.com/#pricing');
    return;
  }

  var CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  var feats = data.features.map(function(f){
    return '<li><span class="chk">'+CHK+'</span>'+f+'</li>';
  }).join('');

  root.innerHTML =
    '<div class="checkout-grid">' +
      /* ── left: tier summary ── */
      '<div class="card" id="summaryCard">' +
        '<div class="card-inner">' +
          '<span class="tier-badge">'+data.badge+'</span>' +
          '<div class="tier-price">$'+data.dollars+'<span class="cents">.'+data.cents+'</span></div>' +
          '<p class="tier-name">'+data.name+'</p>' +
          '<p class="tier-sum">'+data.summary+'</p>' +
          '<div class="div"></div>' +
          '<ul class="features">'+feats+'</ul>' +
          '<div class="div"></div>' +
          '<p class="trust">'+LOCK+'One payment. No subscription. Instant access.</p>' +
        '</div>' +
      '</div>' +
      /* ── right: payment form ── */
      '<div class="card" id="payCard">' +
        '<div class="card-inner">' +
          /* Native pay buttons — hidden until Square confirms availability */
          '<div id="native-pay-wrap" style="display:none">' +
            '<button class="native-pay-btn" id="google-pay-button" type="button" aria-label="Pay with Google Pay" style="display:none">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="58" height="24" viewBox="0 0 58 24"><path d="M6.1 10.8v2.5h3.8c-.2.9-.9 2.2-3.8 2.2-2.3 0-4.2-1.9-4.2-4.2s1.9-4.2 4.2-4.2c1.3 0 2.2.6 2.7 1l1.9-1.8C9.5 5.2 7.9 4.6 6.1 4.6c-3.5 0-6.3 2.8-6.3 6.3s2.8 6.3 6.3 6.3c3.6 0 6-2.5 6-6.1 0-.4 0-.7-.1-1H6.1z" fill="#4285F4"/><path d="M57.6 10.9h-2.3V8.6h-1.5v2.3h-2.3v1.5h2.3v2.3h1.5v-2.3h2.3z" fill="#34A853"/><path d="M22.5 8.4h-5.4v1.4h4c-.2 1-1 2.4-4 2.4-2.4 0-4.4-2-4.4-4.4s2-4.4 4.4-4.4c1.4 0 2.3.6 2.8 1.1l1-1C20.2 2.8 18.9 2 17.1 2 13.8 2 11.2 4.7 11.2 8s2.6 6 5.9 6c3.4 0 5.7-2.4 5.7-5.8 0-.4 0-.6-.1-.8h-.2z" fill="#4285F4"/><path d="M31.6 4.6c-1.9 0-3.4 1.4-3.4 3.4s1.5 3.4 3.4 3.4 3.4-1.5 3.4-3.4-1.5-3.4-3.4-3.4zm0 5.4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#EA4335"/><path d="M39.4 4.6c-1.9 0-3.4 1.4-3.4 3.4s1.5 3.4 3.4 3.4 3.4-1.5 3.4-3.4-1.5-3.4-3.4-3.4zm0 5.4c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#FBBC04"/><path d="M47 4.8h-.1c-.4-.5-1.1-.8-2-.8-1.9 0-3.6 1.6-3.6 3.5s1.7 3.4 3.6 3.4c.9 0 1.6-.4 2-.8h.1v.5c0 1.3-.7 2-1.9 2-1 0-1.6-.7-1.8-1.3l-1.2.5c.4 1 1.5 2.2 3.1 2.2 1.8 0 3.3-1.1 3.3-3.6V4.9H47v-.1zm-1.9 5.4c-1.1 0-2-.9-2-2.1 0-1.2.9-2.1 2-2.1s2 .9 2 2.1c0 1.2-.9 2.1-2 2.1z" fill="#4285F4"/></svg>' +
            '</button>' +
            '<button class="native-pay-btn" id="apple-pay-button" type="button" aria-label="Pay with Apple Pay" style="display:none">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="22" viewBox="0 0 814 1000" fill="#fff"><path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-42.4-150.3-109.2c-52.1-79.4-98.2-207.3-98.2-329.2 0-170.1 111.4-260 221-260 75.5 0 138.1 49.1 185.1 49.1 44.6 0 115.2-52.6 199.2-52.6zm-200.1-175.4c37.5-44.8 64.1-107.2 64.1-169.5 0-8.9-.6-17.9-2.2-25.5-60.5 2.3-132.4 40.2-175.9 91.4-34 37.9-66.5 101.4-66.5 164.6 0 9.5 1.7 19 2.3 22.2 4 .6 10.6 1.7 17.2 1.7 54.1 0 122.5-36.5 161-84.9z"/></svg>' +
              ' Apple Pay' +
            '</button>' +
            '<div class="pay-divider"><span>or pay with card</span></div>' +
          '</div>' +
          '<div class="form-section">' +
            '<label class="form-label" for="card-container">Card details</label>' +
            '<div id="card-container"></div>' +
          '</div>' +
          '<button class="btn-pay" id="checkoutBtn" type="button" disabled>' +
            '<i class="spin" aria-hidden="true"></i>' +
            '<span class="btn-label">Complete Purchase</span>' +
            '<span class="arw" aria-hidden="true"> →</span>' +
          '</button>' +
          '<div class="err" id="errBanner" role="alert" aria-live="polite"></div>' +
          '<p class="pay-note">'+LOCK+' Encrypted &nbsp;·&nbsp; Powered by Square</p>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '';

  var btn = document.getElementById('checkoutBtn');
  var err = document.getElementById('errBanner');

  function showErr(msg){
    err.textContent = msg;
    err.classList.add('show');
  }
  function clearErr(){
    err.textContent = '';
    err.classList.remove('show');
  }

  /* Dollar amounts must match lib/square.js PRODUCT_PRICES (/100) */
  var DOLLAR_AMOUNTS = { access: '29.99', system: '59.99', control: '99.99' };

  async function submitCharge(sourceId){
    var charge = await fetch('/api/charge', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ sourceId: sourceId, tier: tier }),
    }).then(function(r){ return r.json(); });

    if(charge.success){
      window.location.href = charge.redirectUrl;
    } else {
      throw new Error(charge.error || 'Payment failed — try again.');
    }
  }

  /* ── init Square Web Payments SDK ── */
  (async function init(){
    try {
      /* 1. Fetch runtime config */
      var cfgRes = await fetch('/api/config');
      if(!cfgRes.ok){ throw new Error('Config fetch failed (' + cfgRes.status + ')'); }
      var cfg = await cfgRes.json();

      if(!cfg.squareAppId || !cfg.squareLocationId){
        showErr(
          'Checkout config missing — contact support. ' +
          '(appId: ' + (cfg.squareAppId  ? 'OK' : 'MISSING') + ', ' +
          'locationId: ' + (cfg.squareLocationId ? 'OK' : 'MISSING') + ')'
        );
        console.error('[pay] /api/config returned:', cfg);
        return;
      }

      /* 2. Load the environment-correct Square.js — production and sandbox
            scripts are NOT interchangeable; mismatching them causes
            "Checkout failed to initialize" from Square.payments(). */
      if(!window.Square){
        await new Promise(function(resolve, reject){
          var s   = document.createElement('script');
          s.src   = cfg.environment === 'production'
            ? 'https://web.squarecdn.com/v1/square.js'
            : 'https://sandbox.web.squarecdn.com/v1/square.js';
          s.async = true;
          s.onload  = resolve;
          s.onerror = function(){ reject(new Error('Square SDK script failed to load — check your connection.')); };
          document.head.appendChild(s);
        });
      }

      /* 3. Init payments object */
      var payments;
      try {
        payments = Square.payments(cfg.squareAppId, cfg.squareLocationId);
      } catch(sqErr){
        var detail = sqErr && sqErr.message ? sqErr.message : String(sqErr);
        showErr('Payment system failed to start — ' + detail + '. Refresh and try again, or contact support.');
        console.error('[pay] Square.payments() threw:', sqErr);
        return;
      }

      /* ── Payment request (used for Apple Pay + Google Pay) ── */
      var paymentRequest = payments.paymentRequest({
        countryCode:  'US',
        currencyCode: 'USD',
        total: {
          amount: DOLLAR_AMOUNTS[tier] || '29.99',
          label:  'WinOnAny',
        },
      });

      var nativeShown = false;

      /* ── Google Pay ──
         Square's googlePay().attach() injects a Google-rendered iframe.
         We hide that iframe (height:0/overflow:hidden) and put our own
         styled button on top — click on ours triggers tokenize() directly. ── */
      try {
        var googlePay = await payments.googlePay(paymentRequest);
        // Square needs a DOM node to attach its hidden iframe into
        var gpHiddenMount = document.createElement('div');
        gpHiddenMount.style.cssText = 'position:absolute;height:0;overflow:hidden;pointer-events:none';
        document.body.appendChild(gpHiddenMount);
        await googlePay.attach(gpHiddenMount);

        var gpBtn = document.getElementById('google-pay-button');
        gpBtn.style.display = 'flex';
        nativeShown = true;

        gpBtn.addEventListener('click', async function(){
          clearErr();
          gpBtn.disabled = true;
          try {
            var result = await googlePay.tokenize();
            if(result.status !== 'OK'){
              throw new Error((result.errors && result.errors[0]) ? result.errors[0].message : 'Google Pay failed.');
            }
            await submitCharge(result.token);
          } catch(e){
            gpBtn.disabled = false;
            showErr(e.message || 'Google Pay failed — try again.');
          }
        });
      } catch(e){
        console.log('[pay] Google Pay unavailable:', e.message);
      }

      /* ── Apple Pay ──
         payments.applePay() returns a tokenizer — no .attach() method exists.
         Our styled <button#apple-pay-button> is already in the DOM; just show it. ── */
      try {
        var applePay = await payments.applePay(paymentRequest);

        var appleBtn = document.getElementById('apple-pay-button');
        appleBtn.style.display = 'flex';
        nativeShown = true;

        appleBtn.addEventListener('click', async function(){
          clearErr();
          appleBtn.disabled = true;
          try {
            var result = await applePay.tokenize();
            if(result.status !== 'OK'){
              throw new Error((result.errors && result.errors[0]) ? result.errors[0].message : 'Apple Pay failed.');
            }
            await submitCharge(result.token);
          } catch(e){
            appleBtn.disabled = false;
            showErr(e.message || 'Apple Pay failed — try again.');
          }
        });
      } catch(e){
        console.log('[pay] Apple Pay unavailable:', e && e.message ? e.message : String(e));
      }

      if(nativeShown){
        document.getElementById('native-pay-wrap').style.display = 'block';
      }

      /* ── Card — Square-supported style properties only ──
         Rules: no backgroundColor, no font-family fallbacks,
         use .is-focus (not .is-focused) ── */
      var card = await payments.card({
        style: {
          '.input-container': {
            borderColor:  'rgba(255,255,255,.12)',
            borderRadius: '0px',
          },
          '.input-container.is-focus': {
            borderColor: '#6E56F8',
          },
          '.input-container.is-error': {
            borderColor: '#ef4444',
          },
          'input': {
            color:      '#050507',
            fontWeight: '400',
          },
          'input::placeholder': {
            color: '#999999',
          },
          '.message-text': {
            color: '#555555',
          },
          '.message-text.is-error': {
            color: '#F87171',
          },
          '.message-icon.is-error': {
            color: '#F87171',
          },
        },
      });

      await card.attach('#card-container');
      btn.disabled = false;

      btn.addEventListener('click', async function(){
        btn.disabled = true;
        btn.classList.add('loading');
        clearErr();

        try {
          var result = await card.tokenize();

          if(result.status !== 'OK'){
            var msg = (result.errors && result.errors[0]) ? result.errors[0].message : 'Card error — check your details.';
            throw new Error(msg);
          }

          await submitCharge(result.token);

        } catch(e){
          btn.disabled = false;
          btn.classList.remove('loading');
          showErr(e.message || 'Something went wrong — try again.');
        }
      });

    } catch(e){
      var msg = e && e.message ? e.message : String(e);
      /* Avoid "Checkout failed to initialize: Checkout failed to initialize…" */
      var display = msg.toLowerCase().startsWith('checkout failed')
        ? msg
        : 'Checkout failed to initialize — ' + msg;
      showErr(display + ' Refresh and try again.');
      console.error('[pay] init error:', e);
    }
  })();

})();
</script>
</body>
</html>
