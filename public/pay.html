<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — WinOnAny</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0F2F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://web.squarecdn.com/v1/square.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EEF0F5;
  --card:#FFFFFF;
  --border:#E2E4EA;
  --shadow:0 1px 4px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.07);
  --text:#111118;
  --muted:#6B7280;
  --subtle:#9CA3AF;
  --ac:#7C3AED;
  --ac-hover:#6D28D9;
  --ac-rgb:124,58,237;
  --radius:10px;
  --sans:'Inter','Helvetica Neue',Arial,sans-serif;
}
html,body{min-height:100%;-webkit-font-smoothing:antialiased}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.6;font-weight:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(20px,4vw,40px) 16px;min-height:100vh;
}

/* ── checkout card ── */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  width:100%;max-width:400px;overflow:hidden;
  animation:up .3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── card header ── */
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 18px;border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--ac);flex-shrink:0}
.secure{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--subtle);font-weight:500}
.secure svg{width:11px;height:11px;flex-shrink:0}

/* ── product summary ── */
.summary{padding:20px 24px 0}
.prod-label{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.prod-price{font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--text);display:flex;align-items:baseline;gap:5px}
.prod-price .curr{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.prod-note{font-size:12.5px;color:var(--subtle);margin-top:6px}

/* ── divider ── */
.div{height:1px;background:var(--border);margin:20px 0}

/* ── payment section ── */
.pay-section{padding:0 24px 24px}
.pay-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin-bottom:10px}

/* Square card container — let Square's iframe sit cleanly */
#card-container{
  border:1px solid var(--border);border-radius:8px;
  padding:4px 2px;background:#fff;
  transition:border-color .2s,box-shadow .2s;
  min-height:44px;
}
#card-container.sq-focused{
  border-color:var(--ac);
  box-shadow:0 0 0 3px rgba(var(--ac-rgb),.12);
}
#card-container.sq-error{
  border-color:#EF4444;
  box-shadow:0 0 0 3px rgba(239,68,68,.10);
}
#card-container iframe{display:block;width:100%}

/* ── pay button ── */
.btn-pay{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:46px;margin-top:14px;
  background:var(--ac);color:#fff;border:0;border-radius:8px;
  font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:-.01em;
  cursor:pointer;position:relative;overflow:hidden;
  transition:background .2s,transform .15s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.btn-pay:not(:disabled):hover{background:var(--ac-hover);box-shadow:0 4px 18px -6px rgba(var(--ac-rgb),.55)}
.btn-pay:not(:disabled):active{transform:scale(.98)}
.btn-pay:disabled{opacity:.55;cursor:not-allowed}
.btn-pay .spin{
  width:16px;height:16px;flex-shrink:0;display:none;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-pay.loading .spin{display:block}
.btn-pay.loading .btn-label{display:none}

/* ── error ── */
.err{
  display:none;margin-top:12px;padding:10px 13px;
  background:#FEF2F2;border:1px solid #FECACA;border-radius:6px;
  font-size:13px;color:#B91C1C;line-height:1.5;
}
.err.show{display:block}

/* ── footer ── */
.card-foot{
  padding:14px 24px;border-top:1px solid var(--border);
  text-align:center;font-size:12px;color:var(--subtle);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.card-foot svg{width:10px;height:10px;flex-shrink:0}
.sq-badge{
  display:inline-flex;align-items:center;gap:4px;
  color:var(--ac);font-weight:500;font-size:12px;
}

/* ── not found state ── */
.not-found{text-align:center;max-width:340px}
.not-found h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;color:var(--text)}
.not-found p{color:var(--muted);font-size:14px;margin-bottom:20px}
.not-found a{
  display:inline-flex;align-items:center;gap:6px;padding:10px 20px;
  background:var(--ac);color:#fff;border-radius:7px;
  font-size:14px;font-weight:600;text-decoration:none;
  transition:background .2s;
}
.not-found a:hover{background:var(--ac-hover)}

@media(max-width:440px){
  .card-head,.summary,.pay-section,.card-foot{padding-left:18px;padding-right:18px}
  .prod-price{font-size:30px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){
  'use strict';

  var TIERS = {
    access: {
      label: 'Starter',
      dollars: '29', cents: '99',
      note: 'One-time payment · Instant access',
    },
    system: {
      label: 'The Vault',
      dollars: '59', cents: '99',
      note: 'One-time payment · Instant access',
    },
    control: {
      label: 'Full Access',
      dollars: '99', cents: '99',
      note: 'One-time payment · Instant access',
    },
  };

  var params = new URLSearchParams(window.location.search);
  var tier   = params.get('tier') || '';
  var data   = TIERS[tier];
  var root   = document.getElementById('root');

  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  if(!data){
    root.innerHTML =
      '<div class="card"><div style="padding:32px 24px"><div class="not-found">' +
        '<h1>Invalid link.</h1>' +
        '<p>That checkout link doesn\'t match any plan. Please go back and select a tier.</p>' +
        '<a href="https://winonany.com/#pricing">← See pricing</a>' +
      '</div></div></div>';
    return;
  }

  var priceStr = '$' + data.dollars + '.' + data.cents;

  root.innerHTML =
    '<div class="card">' +

      /* header */
      '<div class="card-head">' +
        '<a class="brand" href="https://winonany.com" aria-label="WinOnAny">' +
          '<span class="brand-dot" aria-hidden="true"></span>WinOnAny' +
        '</a>' +
        '<span class="secure">' + LOCK + 'Secure</span>' +
      '</div>' +

      /* product summary */
      '<div class="summary">' +
        '<p class="prod-label">' + data.label + '</p>' +
        '<div class="prod-price">$' + data.dollars + '<span class="curr">.' + data.cents + ' USD</span></div>' +
        '<p class="prod-note">' + data.note + '</p>' +
      '</div>' +

      /* divider */
      '<div style="padding:0 24px"><div class="div"></div></div>' +

      /* payment */
      '<div class="pay-section">' +
        '<p class="pay-label">Card details</p>' +
        '<div id="card-container"></div>' +
        '<button class="btn-pay" id="payBtn" type="button" disabled>' +
          '<i class="spin" aria-hidden="true"></i>' +
          '<span class="btn-label">Pay ' + priceStr + '</span>' +
        '</button>' +
        '<div class="err" id="errBox" role="alert" aria-live="polite"></div>' +
      '</div>' +

      /* footer */
      '<div class="card-foot">' +
        LOCK +
        'Encrypted &nbsp;·&nbsp; Powered by <span class="sq-badge">Square</span>' +
      '</div>' +

    '</div>';

  var btn = document.getElementById('payBtn');
  var err = document.getElementById('errBox');

  function showErr(msg){ err.textContent = msg; err.classList.add('show'); }
  function clearErr(){ err.textContent = ''; err.classList.remove('show'); }

  /* Square Web Payments SDK init */
  (async function init(){
    try {
      var cfg = await fetch('/api/config').then(function(r){ return r.json(); });
      if(!window.Square){ showErr('Payment system failed to load — refresh and try again.'); return; }

      var payments = Square.payments(cfg.squareAppId, cfg.squareLocationId);

      /* Style Square's fields to match the light card */
      var card = await payments.card({
        style: {
          '.input-container': {
            borderColor: '#E2E4EA',
            borderRadius: '6px',
            backgroundColor: '#FFFFFF',
          },
          '.input-container.is-focused': {
            borderColor: '#7C3AED',
          },
          '.input-container.is-error': {
            borderColor: '#EF4444',
          },
          'input': {
            color: '#111118',
            fontFamily: '"Inter","Helvetica Neue",Arial,sans-serif',
            fontSize: '14px',
            fontWeight: '400',
          },
          'input::placeholder': {
            color: '#9CA3AF',
          },
          '.message-text': {
            color: '#6B7280',
            fontFamily: '"Inter","Helvetica Neue",Arial,sans-serif',
            fontSize: '12px',
          },
          '.message-text.is-error': { color: '#B91C1C' },
          '.message-icon': { color: '#9CA3AF' },
          '.message-icon.is-error': { color: '#B91C1C' },
        },
      });

      await card.attach('#card-container');
      btn.disabled = false;

      btn.addEventListener('click', async function(){
        btn.disabled = true;
        btn.classList.add('loading');
        clearErr();

        try {
          var result = await card.tokenize();
          if(result.status !== 'OK'){
            var msg = (result.errors && result.errors[0]) ? result.errors[0].message : 'Card error — check your details.';
            throw new Error(msg);
          }

          var charge = await fetch('/api/charge', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sourceId: result.token, tier: tier }),
          }).then(function(r){ return r.json(); });

          if(charge.success){
            window.location.href = charge.redirectUrl || ('https://winonany.com/success?tier=' + tier);
          } else {
            throw new Error(charge.error || 'Payment failed — try again.');
          }

        } catch(e){
          btn.disabled = false;
          btn.classList.remove('loading');
          showErr(e.message || 'Something went wrong — try again.');
        }
      });

    } catch(e){
      showErr('Checkout failed to initialize. Refresh and try again.');
      console.error('[pay] init error:', e);
    }
  })();

})();
</script>
</body>
</html>
