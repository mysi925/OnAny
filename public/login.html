<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login — WinOnAny</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0}
:root{--void:#050507;--panel:#0B0B0F;--panel-2:#101016;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--text:#F2F2F4;--muted:#85858F;--muted-2:#5C5C66;--accent:#6E56F8;--accent-lift:#8B78FF;--ease:cubic-bezier(.16,1,.3,1)}
html,body{min-height:100%;-webkit-font-smoothing:antialiased}
body{background:var(--void);color:var(--text);font-family:'Archivo',Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 18px}
.glow{position:fixed;left:50%;top:0;width:min(700px,120vw);height:50vh;transform:translateX(-50%);
  pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(110,86,248,.18),transparent 68%);filter:blur(12px)}
.wrap{position:relative;z-index:2;width:100%;max-width:400px}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.04em;margin-bottom:36px;text-decoration:none;color:var(--text)}
.mark .dot{width:7px;height:7px;background:var(--accent);box-shadow:0 0 14px 2px rgba(110,86,248,.8)}
.card{background:var(--panel);border:1px solid var(--line);padding:clamp(28px,5vw,40px);position:relative}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),#9A4AC8)}
h1{font-size:clamp(22px,5vw,30px);font-weight:800;letter-spacing:-.04em;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:28px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.field label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
.field input{background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);
  font-family:'Archivo',Arial,sans-serif;font-size:15px;padding:14px 16px;width:100%;
  transition:border-color .25s;outline:none;-webkit-appearance:none}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--muted-2)}
.submit{display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--accent);color:#fff;font-family:'Archivo',Arial,sans-serif;
  font-size:15px;font-weight:600;padding:16px;width:100%;border:0;
  cursor:pointer;transition:background .3s;margin-top:4px;-webkit-tap-highlight-color:transparent}
.submit:hover{background:var(--accent-lift)}
.submit:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;line-height:1.6;display:none}
.msg.err{color:#E05555;display:block}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">
  <a class="mark" href="/"><span class="dot" aria-hidden="true"></span>WinOnAny</a>
  <div class="card">
    <h1>Log in</h1>
    <p class="sub">Access your vault and re-download your files any time.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit" id="loginBtn">Log in →</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var pass  = document.getElementById('password').value;
  var btn   = document.getElementById('loginBtn');
  var msg   = document.getElementById('loginMsg');
  if(!email || !pass){ msg.textContent='Email and password required.'; msg.className='msg err'; return; }
  btn.disabled = true; btn.textContent = 'Logging in…'; msg.className='msg';
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){ window.location.href='/portal'; }
    else{ msg.textContent=d.error||'Login failed.'; msg.className='msg err'; btn.disabled=false; btn.textContent='Log in →'; }
  })
  .catch(function(){ msg.textContent='Connection error. Try again.'; msg.className='msg err'; btn.disabled=false; btn.textContent='Log in →'; });
});
</script>
</body>
</html>
